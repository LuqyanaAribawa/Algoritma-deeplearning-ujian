<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 EXTREME MEMORY - Deep Learning Mastery</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto+Mono:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --neon-red: #ff0040;
            --neon-green: #00ff88;
            --neon-blue: #00d4ff;
            --neon-purple: #bf00ff;
            --neon-yellow: #ffee00;
            --dark-bg: #0a0a0f;
            --card-bg: #12121a;
        }
        
        body {
            font-family: 'Roboto Mono', monospace;
            background: var(--dark-bg);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(255, 0, 64, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(191, 0, 255, 0.1) 0%, transparent 60%);
        }
        
        /* Neural Network Animation */
        .neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }
        
        .neuron {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-blue);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }
        
        /* Header */
        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(180deg, rgba(255, 0, 64, 0.2) 0%, transparent 100%);
            border-bottom: 2px solid var(--neon-red);
            position: relative;
        }
        
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 5vw, 3rem);
            background: linear-gradient(90deg, var(--neon-red), var(--neon-purple), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 0, 64, 0.5);
            animation: glitch 3s infinite;
        }
        
        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-2px, 2px); }
            94% { transform: translate(2px, -2px); }
            96% { transform: translate(-2px, -2px); }
            98% { transform: translate(2px, 2px); }
        }
        
        .header .subtitle {
            color: var(--neon-yellow);
            margin-top: 10px;
            font-size: 0.9rem;
        }
        
        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
            background: rgba(18, 18, 26, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-icon {
            font-size: 1.5rem;
        }
        
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--neon-green);
        }
        
        .stat-label {
            font-size: 0.7rem;
            color: #888;
        }
        
        /* Progress Bar */
        .progress-container {
            width: 200px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-red), var(--neon-green));
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px var(--neon-green);
        }
        
        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            flex-wrap: wrap;
        }
        
        .nav-tab {
            padding: 15px 30px;
            background: var(--card-bg);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .nav-tab:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            transform: translateY(-3px);
        }
        
        .nav-tab.active {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            border-color: transparent;
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.5);
        }
        
        /* Main Content */
        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .section {
            display: none;
        }
        
        .section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Quiz Mode */
        .quiz-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .quiz-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-red), var(--neon-purple), var(--neon-blue));
        }
        
        .question-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: var(--neon-purple);
            opacity: 0.3;
            position: absolute;
            top: 20px;
            right: 30px;
        }
        
        .question-text {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 25px;
            padding-right: 80px;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            padding: 18px 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .option:hover:not(.disabled) {
            border-color: var(--neon-blue);
            background: rgba(0, 212, 255, 0.1);
            transform: translateX(10px);
        }
        
        .option.selected {
            border-color: var(--neon-yellow);
            background: rgba(255, 238, 0, 0.15);
        }
        
        .option.correct {
            border-color: var(--neon-green);
            background: rgba(0, 255, 136, 0.2);
            animation: correctPulse 0.5s ease;
        }
        
        @keyframes correctPulse {
            0%, 100% { box-shadow: 0 0 0 rgba(0, 255, 136, 0); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.5); }
        }
        
        .option.wrong {
            border-color: var(--neon-red);
            background: rgba(255, 0, 64, 0.2);
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .option-letter {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
        }
        
        .option.correct .option-letter {
            background: var(--neon-green);
            color: #000;
        }
        
        .option.wrong .option-letter {
            background: var(--neon-red);
            color: #000;
        }
        
        /* Memory Trick Box */
        .memory-trick {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(255, 0, 64, 0.15), rgba(191, 0, 255, 0.15));
            border-radius: 15px;
            border-left: 4px solid var(--neon-red);
            display: none;
        }
        
        .memory-trick.show {
            display: block;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .memory-trick-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-red);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .memory-trick-content {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #ddd;
        }
        
        .keyword {
            color: var(--neon-yellow);
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 238, 0, 0.5);
        }
        
        .pain-point {
            color: var(--neon-red);
            font-weight: bold;
        }
        
        .reward {
            color: var(--neon-green);
            font-weight: bold;
        }
        
        /* Quiz Controls */
        .quiz-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 35px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            color: #fff;
        }
        
        .btn-primary:hover {
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            transform: scale(1.05);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--neon-red), #ff6600);
            color: #fff;
        }
        
        .btn-danger:hover {
            box-shadow: 0 0 30px rgba(255, 0, 64, 0.5);
            transform: scale(1.05);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #00aa55, var(--neon-green));
            color: #000;
        }
        
        .btn-success:hover {
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            transform: scale(1.05);
        }
        
        /* Essay Section */
        .essay-card {
            background: var(--card-bg);
            border-radius: 20px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .essay-header {
            padding: 25px;
            background: linear-gradient(135deg, rgba(191, 0, 255, 0.2), rgba(0, 212, 255, 0.2));
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .essay-header:hover {
            background: linear-gradient(135deg, rgba(191, 0, 255, 0.3), rgba(0, 212, 255, 0.3));
        }
        
        .essay-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--neon-blue);
        }
        
        .essay-toggle {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }
        
        .essay-card.open .essay-toggle {
            transform: rotate(180deg);
        }
        
        .essay-content {
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s ease;
        }
        
        .essay-card.open .essay-content {
            padding: 25px;
            max-height: 5000px;
        }
        
        /* Code Block */
        .code-block {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        
        .code-block::before {
            content: 'PYTHON';
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 0.7rem;
            color: var(--neon-green);
            font-family: 'Orbitron', sans-serif;
        }
        
        .code-block pre {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #e0e0e0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .code-comment {
            color: #6a9955;
        }
        
        .code-keyword {
            color: #569cd6;
        }
        
        .code-function {
            color: #dcdcaa;
        }
        
        .code-string {
            color: #ce9178;
        }
        
        .code-number {
            color: #b5cea8;
        }
        
        /* Output Block */
        .output-block {
            background: #0d0d15;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid var(--neon-green);
            position: relative;
        }
        
        .output-block::before {
            content: '📤 OUTPUT';
            position: absolute;
            top: -12px;
            left: 20px;
            background: var(--card-bg);
            padding: 0 10px;
            font-size: 0.75rem;
            color: var(--neon-green);
            font-family: 'Orbitron', sans-serif;
        }
        
        .output-block pre {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--neon-green);
        }
        
        /* Explanation Box */
        .explanation-box {
            background: rgba(0, 212, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid var(--neon-blue);
        }
        
        .explanation-box h4 {
            color: var(--neon-blue);
            margin-bottom: 15px;
            font-family: 'Orbitron', sans-serif;
        }
        
        .explanation-box ul {
            list-style: none;
            padding: 0;
        }
        
        .explanation-box li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 10px;
        }
        
        .explanation-box li::before {
            content: '▹';
            color: var(--neon-purple);
        }
        
        .func-name {
            color: var(--neon-yellow);
            font-weight: bold;
        }
        
        /* Flashcard Mode */
        .flashcard-container {
            perspective: 1000px;
            margin: 20px auto;
            max-width: 600px;
        }
        
        .flashcard {
            position: relative;
            width: 100%;
            min-height: 300px;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
            cursor: pointer;
        }
        
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        
        .flashcard-face {
            position: absolute;
            width: 100%;
            min-height: 300px;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .flashcard-front {
            background: linear-gradient(135deg, var(--card-bg), #1a1a2e);
            border: 2px solid var(--neon-purple);
        }
        
        .flashcard-back {
            background: linear-gradient(135deg, #1a2e1a, #0d150d);
            border: 2px solid var(--neon-green);
            transform: rotateY(180deg);
        }
        
        .flashcard-question {
            font-size: 1.1rem;
            line-height: 1.8;
        }
        
        .flashcard-answer {
            font-size: 1.3rem;
            color: var(--neon-green);
            font-family: 'Orbitron', sans-serif;
        }
        
        .flashcard-hint {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #888;
        }
        
        /* Score Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        
        .modal {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 50px rgba(191, 0, 255, 0.3);
        }
        
        .modal-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin-bottom: 15px;
        }
        
        .modal-score {
            font-size: 4rem;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .modal-message {
            margin: 20px 0;
            font-size: 1.1rem;
            color: #aaa;
        }
        
        /* Fear Counter */
        .fear-counter {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 0, 64, 0.9);
            padding: 15px 25px;
            border-radius: 15px;
            font-family: 'Orbitron', sans-serif;
            display: none;
            animation: fearPulse 1s infinite;
            z-index: 100;
        }
        
        .fear-counter.show {
            display: block;
        }
        
        @keyframes fearPulse {
            0%, 100% { box-shadow: 0 0 10px var(--neon-red); }
            50% { box-shadow: 0 0 30px var(--neon-red); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .stat-item {
                padding: 8px 12px;
            }
            
            .stat-value {
                font-size: 1rem;
            }
            
            .question-number {
                font-size: 2rem;
                top: 10px;
                right: 15px;
            }
            
            .question-text {
                padding-right: 50px;
                font-size: 1rem;
            }
            
            .nav-tab {
                padding: 10px 20px;
                font-size: 0.8rem;
            }
        }
        
        /* Quick Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .summary-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .summary-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }
        
        .summary-card h4 {
            color: var(--neon-purple);
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
        }
        
        .summary-card p {
            color: var(--neon-green);
            font-size: 1.1rem;
            font-weight: bold;
        }
        
        /* Streak Animation */
        .streak-fire {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            z-index: 200;
            animation: fireUp 1s ease forwards;
            pointer-events: none;
            display: none;
        }
        
        .streak-fire.show {
            display: block;
        }
        
        @keyframes fireUp {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -100%) scale(1); }
        }
        
        /* All Questions List */
        .question-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 8px;
            margin: 20px 0;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 15px;
        }
        
        .question-dot {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
        }
        
        .question-dot:hover {
            background: var(--neon-blue);
            color: #000;
        }
        
        .question-dot.current {
            background: var(--neon-purple);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-purple);
        }
        
        .question-dot.correct {
            background: var(--neon-green);
            color: #000;
        }
        
        .question-dot.wrong {
            background: var(--neon-red);
            color: #fff;
        }
        
        /* Timer */
        .timer {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--neon-yellow);
        }
        
        .timer.danger {
            color: var(--neon-red);
            animation: timerPulse 0.5s infinite;
        }
        
        @keyframes timerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="neural-bg" id="neuralBg"></div>
    
    <header class="header">
        <h1>🧠 EXTREME MEMORY TRAINER</h1>
        <p class="subtitle">Deep Learning - Teknik Ingatan Permanen dengan Psikologi Ekstrem</p>
    </header>
    
    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-icon">🎯</span>
            <div>

def perceptron_or(x1, x2):

    bias = -0.2  # Bias
    X = np.array([x1, x2])

            {

                title: "ESSAY 6: Data Cleansing dengan Pandas",
                code: `import pandas as pd

        ];

        // =====================================================
        // RINGKASAN CEPAT
        // =====================================================
        const summaryItems = [
            { key: "DL vs ML", value: "DL belajar FITUR OTOMATIS dari data mentah" },
            { key: "Unsupervised", value: "TANPA LABEL - mencari pola tersembunyi" },
            { key: "Setelah Data Prep", value: "TRAIN MODEL" },
            { key: "Transpose", value: "TUKAR baris↔kolom (4×3 → 3×4)" },
            { key: "NumPy", value: "Library ARRAY & MATRIKS fundamental" },
            { key: "Gradient Descent", value: "Pakai DIFFERENTIATION (turunan)" },
            { key: "Cost Function", value: "Ukur PERBEDAAN prediksi vs aktual" },
            { key: "Backpropagation", value: "Error disebarkan MUNDUR untuk belajar" },
            { key: "TensorFlow", value: "DATA FLOW GRAPH" },
            { key: "Tensor", value: "Unit DATA yang mengalir" },
            { key: "Keras", value: "WRAPPER mudah untuk TensorFlow" },
            { key: "RNN", value: "Data SEKUENSIAL + MEMORI" },
            { key: "LSTM", value: "RNN + GATES (Input, Forget, Output)" },
            { key: "Conv Layer", value: "EKSTRAKSI FITUR dengan filter" },
            { key: "Max Pooling", value: "KURANGI dimensi" },
            { key: "Weight Sharing", value: "Lokalitas SPASIAL" },
            { key: "Autoencoder", value: "ENCODE-DECODE untuk reduksi dimensi" },
            { key: "RBM", value: "VISIBLE + HIDDEN layer" },
            { key: "LSTM untuk", value: "LANGUAGE MODELLING" },
            { key: "Pandas", value: "DATA TABULAR (loading, cleansing)" },
            { key: "Google Colab", value: "Platform terintegrasi DL" },
            { key: "Learning Rate", value: "UKURAN LANGKAH update weight" },
            { key: "ReLU", value: "Activation HIDDEN LAYER terbaik" },
            { key: "CNN untuk", value: "IMAGE PROCESSING" },
            { key: "axis=0", value: "Per KOLOM (vertikal)" }
        ];

        // =====================================================
        // STATE VARIABLES
        // =====================================================
        let currentQuestion = 0;
        let currentFlashcard = 0;
        let score = 0;
        let streak = 0;
        let wrongCount = 0;
        let answered = new Array(questions.length).fill(null);
        let timer = 0;
        let timerInterval = null;

        // =====================================================
        // INITIALIZATION
        // =====================================================
        function init() {
            createNeuralBackground();
            renderQuestionList();
            renderQuestion();
            renderFlashcard();
            renderEssays();
            renderSummary();
            startTimer();
        }

        function createNeuralBackground() {
            const container = document.getElementById('neuralBg');
            for (let i = 0; i < 30; i++) {
                const neuron = document.createElement('div');
                neuron.className = 'neuron';
                neuron.style.left = Math.random() * 100 + '%';
                neuron.style.top = Math.random() * 100 + '%';
                neuron.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(neuron);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                const mins = Math.floor(timer / 60).toString().padStart(2, '0');
                const secs = (timer % 60).toString().padStart(2, '0');
                document.getElementById('timerValue').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        // =====================================================
        // NAVIGATION
        // =====================================================
        function switchSection(section) {
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(section + 'Section').classList.add('active');
        }

        // =====================================================
        // QUIZ FUNCTIONS
        // =====================================================
        function renderQuestionList() {
            const container = document.getElementById('questionList');
            container.innerHTML = questions.map((q, i) => `
                <div class="question-dot ${i === currentQuestion ? 'current' : ''} ${answered[i] === true ? 'correct' : ''} ${answered[i] === false ? 'wrong' : ''}" 
                     onclick="goToQuestion(${i})">
                    ${i + 1}
                </div>
            `).join('');
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quizContainer');
            
            container.innerHTML = `
                <span class="question-number">#${q.id}</span>
                <div class="question-text">${q.question}</div>
                <div class="options">
                    ${q.options.map((opt, i) => `
                        <div class="option ${answered[currentQuestion] !== null ? 'disabled' : ''} ${answered[currentQuestion] !== null && i === q.correct ? 'correct' : ''} ${answered[currentQuestion] === false && i !== q.correct && document.querySelector('.option.selected')?.dataset.index == i ? 'wrong' : ''}" 
                             data-index="${i}" onclick="selectOption(${i})">
                            <span class="option-letter">${String.fromCharCode(65 + i)}</span>
                            <span>${opt}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="memory-trick ${answered[currentQuestion] !== null ? 'show' : ''}" id="memoryTrick">
                    <div class="memory-trick-title">🧠 TRIK INGATAN EKSTREM</div>
                    <div class="memory-trick-content">${q.memoryTrick}</div>
                </div>
            `;
            
            updateProgress();
        }

        function selectOption(index) {
            if (answered[currentQuestion] !== null) return;
            
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            document.querySelector(`.option[data-index="${index}"]`).classList.add('selected');
        }

        function checkAnswer() {
            const selected = document.querySelector('.option.selected');
            if (!selected || answered[currentQuestion] !== null) return;
            
            const selectedIndex = parseInt(selected.dataset.index);
            const q = questions[currentQuestion];
            const isCorrect = selectedIndex === q.correct;
            
            answered[currentQuestion] = isCorrect;
            
            // Update UI
            document.querySelectorAll('.option').forEach((opt, i) => {
                opt.classList.add('disabled');
                if (i === q.correct) {
                    opt.classList.add('correct');
                } else if (i === selectedIndex && !isCorrect) {
                    opt.classList.add('wrong');
                }
            });
            
            // Show memory trick
            document.getElementById('memoryTrick').classList.add('show');
            
            // Update stats
            if (isCorrect) {
                score += 10;
                streak++;
                if (streak >= 3) {
                    showStreakFire();
                }
            } else {
                streak = 0;
                wrongCount++;
                document.getElementById('fearCounter').classList.add('show');
                document.getElementById('wrongCount').textContent = wrongCount;
            }
            
            document.getElementById('scoreValue').textContent = score;
            document.getElementById('streakValue').textContent = streak;
            
            renderQuestionList();
            updateProgress();
            
            // Check if all questions answered
            if (answered.filter(a => a !== null).length === questions.length) {
                setTimeout(showResults, 1000);
            }
        }

        function showStreakFire() {
            const fire = document.getElementById('streakFire');
            fire.classList.add('show');
            setTimeout(() => fire.classList.remove('show'), 1000);
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
                renderQuestionList();
            }
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
                renderQuestionList();
            }
        }

        function goToQuestion(index) {
            currentQuestion = index;
            renderQuestion();
            renderQuestionList();
        }

        function updateProgress() {
            const progress = (answered.filter(a => a !== null).length / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function resetQuiz() {
            currentQuestion = 0;
            score = 0;
            streak = 0;
            wrongCount = 0;
            answered = new Array(questions.length).fill(null);
            timer = 0;
            
            document.getElementById('scoreValue').textContent = '0';
            document.getElementById('streakValue').textContent = '0';
            document.getElementById('fearCounter').classList.remove('show');
            
            renderQuestionList();
            renderQuestion();
        }

        function showResults() {
            const correctCount = answered.filter(a => a === true).length;
            const percentage = Math.round((correctCount / questions.length) * 100);
            
            let icon, title, message;
            if (percentage >= 90) {
                icon = '🏆';
                title = 'SEMPURNA!';
                message = 'Otak kamu sudah ter-encode dengan sempurna!';
            } else if (percentage >= 70) {
                icon = '🎉';
                title = 'BAGUS!';
                message = 'Terus latihan untuk mencapai kesempurnaan!';
            } else if (percentage >= 50) {
                icon = '💪';
                title = 'LUMAYAN';
                message = 'Masih perlu latihan lebih intensif!';
            } else {
                icon = '😱';
                title = 'BAHAYA!';
                message = 'Ulangi lagi dan gunakan trik ingatan!';
            }
            
            document.getElementById('modalIcon').textContent = icon;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalScore').textContent = `${correctCount}/${questions.length}`;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('scoreModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('scoreModal').classList.remove('show');
        }

        // =====================================================
        // FLASHCARD FUNCTIONS
        // =====================================================
        function renderFlashcard() {
            const q = questions[currentFlashcard];
            document.getElementById('flashcardQuestion').innerHTML = `
                <strong>Soal ${q.id}:</strong><br><br>
                ${q.question}
            `;
            document.getElementById('flashcardAnswer').innerHTML = `
                ${String.fromCharCode(65 + q.correct)}. ${q.options[q.correct]}
            `;
            document.getElementById('flashcardCurrent').textContent = currentFlashcard + 1;
            document.getElementById('flashcardTotal').textContent = questions.length;
            document.getElementById('flashcard').classList.remove('flipped');
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function prevFlashcard() {
            if (currentFlashcard > 0) {
                currentFlashcard--;
                renderFlashcard();
            }
        }

        function nextFlashcard() {
            if (currentFlashcard < questions.length - 1) {
                currentFlashcard++;
                renderFlashcard();
            }
        }

        function shuffleFlashcards() {
            currentFlashcard = Math.floor(Math.random() * questions.length);
            renderFlashcard();
        }

        // =====================================================
        // ESSAY FUNCTIONS
        // =====================================================
        function renderEssays() {
            const container = document.getElementById('essayContainer');
            container.innerHTML = essays.map(essay => `
                <div class="essay-card" id="essay${essay.id}">
                    <div class="essay-header" onclick="toggleEssay(${essay.id})">
                        <span class="essay-title">${essay.title}</span>
                        <span class="essay-toggle">▼</span>
                    </div>
                    <div class="essay-content">
                        <div class="code-block">
                            <pre>${escapeHtml(essay.code)}</pre>
                        </div>
                        
                        <div class="explanation-box">
                            <h4>📖 Penjelasan Fungsi:</h4>
                            <ul>
                                ${essay.explanation.map(exp => `
                                    <li><span class="func-name">${exp.func}</span>: ${exp.desc}</li>
                                `).join('')}
                            </ul>
                        </div>
                        
                        ${essay.calculation ? `
                            <div class="explanation-box" style="border-left-color: var(--neon-yellow);">
                                <h4 style="color: var(--neon-yellow);">🧮 Perhitungan:</h4>
                                <pre style="color: #ddd;">${essay.calculation}</pre>
                            </div>
                        ` : ''}
                        
                        <div class="output-block">
                            <pre>${essay.output}</pre>
                        </div>
                        
                        <div class="memory-trick show">
                            <div class="memory-trick-title">🧠 TRIK INGATAN</div>
                            <div class="memory-trick-content">${essay.memoryTrick}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleEssay(id) {
            document.getElementById('essay' + id).classList.toggle('open');
        }

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;')
                       .replace(/"/g, '&quot;')
                       .replace(/'/g, '&#039;');
        }

        // =====================================================
        // SUMMARY FUNCTIONS
        // =====================================================
        function renderSummary() {
            const container = document.getElementById('summaryGrid');
            container.innerHTML = summaryItems.map(item => `
                <div class="summary-card">
                    <h4>${item.key}</h4>
                    <p>${item.value}</p>
                </div>
            `).join('');
        }

        // =====================================================
        // KEYBOARD SHORTCUTS
        // =====================================================
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('quizSection').classList.contains('active')) {
                if (e.key === 'ArrowLeft') prevQuestion();
                if (e.key === 'ArrowRight') nextQuestion();
                if (e.key === 'Enter') checkAnswer();
                if (e.key >= '1' && e.key <= '4') {
                    const index = parseInt(e.key) - 1;
                    selectOption(index);
                }
            }
            if (document.getElementById('flashcardSection').classList.contains('active')) {
                if (e.key === 'ArrowLeft') prevFlashcard();
                if (e.key === 'ArrowRight') nextFlashcard();
                if (e.key === ' ') flipCard();
            }
        });

        // Initialize app
        init();
    </script>
